# Render blueprint for PAL España — deploy a free always-on Node server.
# In Render: New + → "Blueprint" → connect the KasNaranja/palespana repo.
# The Gemini keys are NOT here (sync:false) — set them in the Render dashboard.
services:
  - type: web
    name: palespana
    runtime: node
    plan: free
    # US region ON PURPOSE (was frankfurt): Google's Gemini free tier started
    # geo-refusing calls from Render's Frankfurt datacenter on 2026-07-28
    # ("User location is not supported") for every model that still has free
    # quota (the 3.x family). The US is Google's canonical supported location.
    # Latency to Vinted/Wallapop is a bit higher from Oregon but irrelevant
    # next to the seconds-long AI analysis.
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true # redeploy automatically on every git push to main
    envVars:
      - key: ENABLE_VINTED
        value: "true"
      - key: ENABLE_WALLAPOP
        value: "true"
      - key: GEMINI_VISION_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_MIN_INTERVAL_MS
        value: "4500"
      - key: WALLAPOP_LAT
        value: "40.4168"
      - key: WALLAPOP_LNG
        value: "-3.7038"
      # Secrets — set their values in the Render dashboard, never committed:
      # One Gemini key:
      - key: GEMINI_API_KEY
        sync: false
      # …or VARIAS claves separadas por comas (cada una de un proyecto Google
      # distinto → multiplica límite diario y velocidad). Tiene prioridad sobre
      # GEMINI_API_KEY. Ej: clave1,clave2,clave3
      - key: GEMINI_API_KEYS
        sync: false
      # Persistent verdict cache (Upstash Redis, free) so redeploys don't wipe
      # the cache and re-burn Gemini's daily quota. Optional: without them the
      # app falls back to an in-memory/file cache.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # eBay Browse API app credentials (developer.ebay.com). eBay is searched
      # only when both are set. Optional.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
