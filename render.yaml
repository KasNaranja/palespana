# Render blueprint for PAL España — TWO free services:
#
#   1. "cazapal" (Frankfurt): the Next.js app itself, close to Vinted/Wallapop.
#   2. "pal-relay" (Oregon): a tiny dependency-free Node relay for Gemini calls.
#
# Why the relay: Google's Gemini free tier geo-blocks calls coming from
# Render's Frankfurt datacenter ("User location is not supported", 400
# FAILED_PRECONDITION) for every model with free quota; the SAME keys work
# from the US. So the app stays in Frankfurt and only the Gemini traffic hops
# through Oregon via the relay.
#
# The relay holds NO secrets: its RELAY_TOKEN is generated by Render
# (generateValue) and handed to the app via fromService — nobody ever types
# or commits it. The Gemini API keys travel per-request in a header and are
# never stored or logged by the relay.
#
# In Render: New + → "Blueprint" → connect the KasNaranja/palespana repo.
# The Gemini keys are NOT here (sync:false) — set them in the Render dashboard.
#
# OJO: un push NO aplica este fichero por sí solo — hace falta una instancia de
# Blueprint conectada en el dashboard (y aprobar el sync si queda pendiente).
# Evidencia: el rename anterior a palespana/oregon ya pusheado nunca llegó a
# aplicarse. Tras pushear: New + → Blueprint → repo KasNaranja/palespana, y en
# la pantalla de revisión comprobar que propone "update cazapal" + "create
# pal-relay" (NO "create cazapal"); al adoptar cazapal por nombre, las claves
# del dashboard (sync: false) sobreviven.
services:
  - type: web
    name: cazapal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true # redeploy automatically on every git push to main
    envVars:
      - key: ENABLE_VINTED
        value: "true"
      - key: ENABLE_WALLAPOP
        value: "true"
      - key: GEMINI_VISION_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MIN_INTERVAL_MS
        value: "4500"
      - key: WALLAPOP_LAT
        value: "40.4168"
      - key: WALLAPOP_LNG
        value: "-3.7038"
      # Gemini calls go out through the US relay (see pal-relay below) because
      # of the Frankfurt geo-block. Unset locally → direct Google endpoint.
      # fromService copia el URL real del servicio (RENDER_EXTERNAL_URL incluye
      # https:// y el subdominio REALMENTE asignado, tenga sufijo o no): nada
      # hardcodeado que pueda quedar huérfano y ser reclamado por un tercero en
      # *.onrender.com, y si pal-relay desaparece del blueprint el sync falla en
      # vez de seguir enviando claves a un dominio ajeno. Si algún día se borra
      # pal-relay, eliminar esta variable en el mismo commit.
      - key: GEMINI_PROXY_URL
        fromService:
          name: pal-relay
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Shared secret for the relay, generated by Render on the pal-relay
      # service and injected here automatically — never typed by anyone.
      - key: RELAY_TOKEN
        fromService:
          name: pal-relay
          type: web
          envVarKey: RELAY_TOKEN
      # Secrets — set their values in the Render dashboard, never committed:
      # Secreto de la sonda /api/gemini-probe (gasta cuota Gemini real, así que
      # NO es pública): elige un valor largo en el dashboard y llama con la
      # cabecera x-probe-secret. Sin valor, la sonda responde siempre 401.
      - key: PROBE_SECRET
        sync: false
      # One Gemini key:
      - key: GEMINI_API_KEY
        sync: false
      # …or VARIAS claves separadas por comas (cada una de un proyecto Google
      # distinto → multiplica límite diario y velocidad). Tiene prioridad sobre
      # GEMINI_API_KEY. Ej: clave1,clave2,clave3
      - key: GEMINI_API_KEYS
        sync: false
      # Persistent verdict cache (Upstash Redis, free) so redeploys don't wipe
      # the cache and re-burn Gemini's daily quota. Optional: without them the
      # app falls back to an in-memory/file cache.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # eBay Browse API app credentials (developer.ebay.com). eBay is searched
      # only when both are set. Optional.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false

  # Gemini relay: US region so Google's free tier accepts the calls. It only
  # forwards :generateContent requests to generativelanguage.googleapis.com and
  # keeps no secrets (token generated by Render, key passed per request).
  - type: web
    name: pal-relay
    runtime: node
    plan: free
    region: oregon
    buildCommand: "echo relay sin build"
    startCommand: "node relay/server.mjs"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: RELAY_TOKEN
        generateValue: true
