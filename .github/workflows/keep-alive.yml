name: keep-alive

# Mantiene despierto el servicio free de Render (se duerme tras ~15 min sin
# tráfico). GitHub Actions hace un ping cada ~10 min. Gratis en repo público.
# Nota: el cron de GitHub puede retrasarse algunos minutos; si aún así notas
# arranques fríos, se puede bajar a */5 o usar un pinger externo (UptimeRobot).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Si se solapan dos runs, cancela el viejo (no hace falta acumular pings).
concurrency:
  group: keep-alive
  cancel-in-progress: true

# actions:write para poder re-activar los workflows programados: GitHub los
# desactiva tras 60 días sin commits en el repo (avisó por email). Llamar al
# endpoint /enable en cada run es idempotente y resetea ese contador, así que
# los robots nunca se apagan solos aunque no haya commits en meses.
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Evitar el auto-apagado por inactividad (re-enable de los crons)
        run: |
          for wf in keep-alive.yml vinted-cookie.yml; do
            curl -s -o /dev/null -w "enable $wf -> HTTP %{http_code}\n" \
              -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
      - name: Ping app (despierta si estaba dormida)
        run: |
          # SOLO se mantiene despierta la app (cazapal, Frankfurt). El relé de
          # Gemini (pal-relay, Oregon) se deja dormir A PROPÓSITO: Render da
          # 750 "free instance hours" al MES por workspace y un servicio free
          # las consume mientras está despierto. Dos servicios 24/7 son
          # ~1.470 h/mes → hacia el día 15 Render suspende TODOS los servicios
          # free hasta el mes siguiente. Uno solo (~744 h) cabe justo. La
          # primera llamada Gemini tras ~15 min de inactividad absorbe el
          # arranque frío del relé (~1 min): el fetch de vision.ts no tiene
          # timeout, simplemente espera.
          for i in 1 2 3 4; do
            code=$(curl -s -m 60 -o /dev/null -w '%{http_code}' "https://cazapal.onrender.com/" || echo 000)
            echo "ping $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Aviso: la app no dio 200 (¿arranque frío en curso?)."
