name: keep-alive

# Mantiene despierto el servicio free de Render (se duerme tras ~15 min sin
# tráfico). GitHub Actions hace un ping cada ~10 min. Gratis en repo público.
# Nota: el cron de GitHub puede retrasarse algunos minutos; si aún así notas
# arranques fríos, se puede bajar a */5 o usar un pinger externo (UptimeRobot).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Si se solapan dos runs, cancela el viejo (no hace falta acumular pings).
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app (despierta si estaba dormida)
        run: |
          # Dos URLs durante la migración frankfurt->oregon (cazapal->palespana);
          # basta con que UNA responda. Cuando el servicio viejo se borre, su URL
          # simplemente fallará y se ignora.
          ok=0
          for URL in "https://palespana.onrender.com/" "https://cazapal.onrender.com/"; do
            for i in 1 2 3 4; do
              code=$(curl -s -m 60 -o /dev/null -w '%{http_code}' "$URL" || echo 000)
              echo "$URL ping $i -> HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 20
            done
          done
          if [ "$ok" = "1" ]; then exit 0; fi
          echo "Aviso: ninguna URL dio 200 (¿arranque frío en curso?)."
